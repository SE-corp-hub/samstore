name: CI

# Quality gate (no database) runs on every push/PR.
# The DB-backed test gate starts its own throwaway Postgres for the run, so it needs no
# secret and can never touch a real database.
# The Playwright critical-path suite needs both servers up, so it is manual; it still
# uses the DATABASE_URL secret, so start it only while that secret is a test database.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: schema + types + secrets + build (no DB)
    runs-on: ubuntu-latest
    env:
      # `prisma validate` requires the env var to exist; it never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma schema validate
        run: npm run db:validate
      - name: Typecheck (contracts + api + web)
        run: npm run typecheck
      - name: Secret / PII scan (filenames only)
        run: npm run check:secrets
      - name: Build
        run: npm run build

  # The DB-backed tests run against their OWN throwaway Postgres, started for this run and
  # thrown away after it. They used to run `prisma migrate deploy` and create test stores in
  # whatever database the DATABASE_URL secret pointed at, which must never be the shop's.
  db-tests:
    name: sequential test gate (own throwaway database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sam_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sam_ci
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      CLAIM_SIGNING_SECRET: ci-only-claim-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Roles a hosted Postgres already has (the security test checks them)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d sam_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE authenticator NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          SQL
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Address list the delivery-zone tests read
        run: npm run db:seed:addresses
      - name: Tests (one file at a time)
        run: npm test
      - name: Reconciliation must report zero drift
        run: npx tsx scripts/reconcile.ts

  e2e:
    name: Playwright critical path (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start API + web against the configured database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLAIM_SIGNING_SECRET: ${{ secrets.CLAIM_SIGNING_SECRET }}
        run: |
          (cd apps/api && PORT=4100 npm run start &)
          (cd apps/web && npm run build && npm run start &)
          npx wait-on http://localhost:4100/health http://localhost:3000/admin/login --timeout 120000
      - run: npm run test:e2e
