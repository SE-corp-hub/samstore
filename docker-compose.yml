services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: ${DATABASE_URL:?Set managed Postgres DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CLAIM_SIGNING_SECRET: ${CLAIM_SIGNING_SECRET:?Set CLAIM_SIGNING_SECRET}
      OUTBOX_WORKER_EMBEDDED: "false"
    expose: ["4100"]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set managed Postgres DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CLAIM_SIGNING_SECRET: ${CLAIM_SIGNING_SECRET:?Set CLAIM_SIGNING_SECRET}
      OUTBOX_POLL_MS: 5000

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api, web]
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

# No local Postgres/Redis service is defined intentionally. The project uses
# managed Postgres + managed Redis, per AGENTS.md. Supply DATABASE_URL/REDIS_URL
# through the operator's secret manager; never commit them here.
